[project]
name = "edp-interface-plates"
version = "1.0.0-beta"
requires-python = "==3.13.2"
dependencies = [
    "sympy>=1.13.0",
    "pint>=0.24.0",
    "uncertainties>=3.2.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "pydantic>=2.9.2",
    "pyyaml>=6.0.2",
    "cadquery>=2.7.0",
    "pygccx @ git+https://github.com/calculix/pygccx.git",
    "svgpathtools>=1.7.2",
]

[dependency-groups]
dev = [
    "black[d]>=26.3.1",
    "poethepoet>=0.32.0",
    "pytest>=8.3.4",
    "ruff>=0.8.4",
    "pytest-cov>=6.0.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.16.0",
    "pip>=25.1.1",
]

[tool.poe.tasks]
format = "black ."
lint = "ruff check"
checks = ["format", "lint"]
notebook = { cmd = "jupyter nbconvert --execute --inplace theory.ipynb", env = { PYTHONPATH = "." } }
build-cg = { cmd = "python cad/model/cg.py", env = { PYTHONPATH = "." } }
build-bg-ac = { cmd = "python cad/model/bg_ac.py", env = { PYTHONPATH = "." } }
build-ex-g = { cmd = "python cad/model/ex_g.py", env = { PYTHONPATH = "." } }
build-ex-c = { cmd = "python cad/model/ex_c.py", env = { PYTHONPATH = "." } }
build = ["build-cg", "build-bg-ac", "build-ex-g", "build-ex-c"]
inspect-cg = "bash -c 'nohup freecad cad/specs/CG/plate.step &>/dev/null &'"
inspect-bg-ac = "bash -c 'nohup freecad cad/specs/BG-AC/plate.step &>/dev/null &'"
inspect-ex-g = "bash -c 'nohup freecad cad/specs/EX-G/plate.step &>/dev/null &'"
inspect-ex-c = "bash -c 'nohup freecad cad/specs/EX-C/plate.step &>/dev/null &'"
generate-plate-cg = "bash -c 'mkdir -p output/drawings && DISPLAY= PYTHONPATH=/usr/lib/freecad/lib:. xvfb-run -a python3 cad/drawing/export_plate_drawing.py --plate-id CG'"
generate-plate-bg-ac = "bash -c 'mkdir -p output/drawings && DISPLAY= PYTHONPATH=/usr/lib/freecad/lib:. xvfb-run -a python3 cad/drawing/export_plate_drawing.py --plate-id BG-AC'"
generate-plate-ex-g = "bash -c 'mkdir -p output/drawings && DISPLAY= PYTHONPATH=/usr/lib/freecad/lib:. xvfb-run -a python3 cad/drawing/export_plate_drawing.py --plate-id EX-G'"
generate-plate-ex-c = "bash -c 'mkdir -p output/drawings && DISPLAY= PYTHONPATH=/usr/lib/freecad/lib:. xvfb-run -a python3 cad/drawing/export_plate_drawing.py --plate-id EX-C'"
healthcheck = "bash -c 'for tool in freecad ccx gmsh rsvg-convert; do command -v $tool >/dev/null || { echo \"MISSING: $tool\"; exit 1; }; done && echo TOOLS_READY'"
sim = { cmd = "pytest -vv sim/", env = { PYTHONPATH = "." } }
test = { cmd = "pytest -vv cad/ sim/", env = { PYTHONPATH = "." } }
cover = { cmd = "pytest -vv --cov=cad --cov=sim cad/ sim/", env = { PYTHONPATH = "." } }
review = "claude 'run code-reviewer agent against diff for quality and elegance'"
commit = "bash -c 'uv run poe checks && uv run poe cover && uv run poe review && git add -A && git cz && git push'"

[tool.coverage.run]
omit = ["*/test_*.py"]
