stages:
  - check
  - deploy
  - mirror

checks:
  stage: check
  script:
    - uv run poe checks
    - uv run poe build
    - uv run poe notebook
    - PYTHONPATH=. uv run pytest --junitxml=junit.xml --cov=cad --cov=sim cad/ sim/
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

deploy:
  stage: deploy
  only:
    - main
  variables:
    AWS_DEFAULT_REGION: us-east-1
    ARCNODE_ARTIFACTS_BUCKET: arcnode-artifacts
  script:
    # Reason: publishes plate artifacts (spec/step/dxf/drawing_meta × commercial+defense)
    # to s3://arcnode-artifacts/plates/{id}/v1/. edp-module-assemblies'
    # plate_loader.fetch downloads from this prefix; without publish here,
    # its CI test_defense_routes_to_evapco_dc_and_dod_bess fails on 404.
    - uv run poe push-s3

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/edp-interface-plates.git
  only:
    - main
