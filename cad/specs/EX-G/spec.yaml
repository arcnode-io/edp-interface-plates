plate_id: EX-G
schema_version: "0"
description: "Interface Plate, External Services, Grid Container"

# EX-G mounts on grid container long wall — opposite the SafeGear service
# aisle (per ADR-XXX, SafeGear at +Y wall, EX-G at -Y wall). Carries
# secondary external services into the grid container:
# - Station-service LV AC (small breaker panel feed for relay heaters)
# - SCADA comms drop (utility-side fiber/copper to relay + meter)
# - Ground reference (site grounding grid tie)
mating_pair:
  side_a: site_external
  side_b: grid_container

outer_dims_mm:
  L: 840   # vertical extent on long wall
  W: 640   # horizontal extent

# Same deployment_contexts as CG/BG-AC.
deployment_contexts:
  commercial:
    material: "6061-T6 aluminum (ASTM B209)"
    finish: "Type II anodize 15-25 μm (MIL-A-8625)"
    thickness_mm: 6
    ip_rating: IP55
    fasteners: "Zn-plated steel M10 (ASTM F593 G1)"
    secondary_seal: null
    ground_stud: M12
  defense_forward:
    material: "5083-H116 marine grade (ASTM B209)"
    finish: "Type III hard anodize 40-60 μm"
    thickness_mm: 10
    ip_rating: IP65
    fasteners: "316 SS M10 (ASTM F593 G2)"
    secondary_seal: "10mm closed-cell EPDM backer"
    ground_stud: M12
  sovereign_government:
    material: "5083-H116 marine grade (ASTM B209)"
    finish: "Type III hard anodize 40-60 μm"
    thickness_mm: 10
    ip_rating: IP65
    fasteners: "316 SS M10 (ASTM F593 G2)"
    secondary_seal: "10mm closed-cell EPDM backer"
    ground_stud: M12

# Penetration schedule: smaller scale than CG/BG-AC. Station service LV
# (~30A 240V) needs only modest conduit; SCADA drop is fiber/copper.
penetration_schedule:
  - id: station_service_conduit
    x_mm: -150
    y_mm: 200
    size_driver: param.power_conduit_od_mm
    fitting_spec: rigid steel conduit hub, threaded
    ots_pn: TBD_after_conduit_supplier_selection
    notes: |
      Station-service LV AC (240V, ~30A) feeding relay heaters,
      lighting, GFCI outlets in grid container. ~3/4" rigid (~28mm OD)
      typical at this load.
  - id: scada_conduit
    x_mm: 150
    y_mm: 200
    size_driver: param.data_conduit_od_mm
    fitting_spec: EMT conduit hub, threaded
    ots_pn: TBD_after_conduit_supplier_selection
    notes: |
      SCADA fiber/copper drop carrying relay + meter telemetry to
      utility SCADA. 1¼" EMT typical.
  - id: ground_stud
    x_mm: -200
    y_mm: -300
    size_driver: context.ground_stud
    fitting_spec: tapped, sealed with conductive gasket
    ots_pn: N/A (machined into plate)
    notes: |
      Ground reference to site grounding grid. M12 (high fault
      current path).

mounting_bolts:
  count: 8
  inset_mm: 60
  diameter_mm: 11
  pattern: corners_and_edge_midpoints

provenance:
  authored_by: human
  authored_date: 2026-05-07
  reviewed_by: TBD_pending_human_review
  reviewed_date: null
  confidence_flags:
    - field: penetration_schedule[*].ots_pn
      flag: missing
      note: Conduit hub vendor selection pending procurement engagement.
    - field: penetration_schedule.station_service_conduit.size_driver
      flag: assumed_default
      note: |
        v1 sized for typical station-service load (~30A 240V).
        Verify with site-specific utility connection requirements.

notes: |
  EX-G is required for all profiles except no_bess (where grid container
  is absent). Mounting on grid container long wall (-Y), opposite the
  SafeGear service aisle wall (+Y where the side door is).

  Penetration positions mirror BG-AC's layout convention but smaller
  (station service is much lower current than BESS feeder).
